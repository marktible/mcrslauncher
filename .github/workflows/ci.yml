name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: ${{ runner.os == 'Linux' && 'linux-glibc235-v1' || 'v0-rust' }}
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxi-dev libgl1-mesa-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Check Linux ABI baseline
        if: runner.os == 'Linux'
        run: python3 scripts/check-linux-abi.py target/release/mcrslauncher --max-glibc 2.35
      - name: Check executable
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            ./target/release/mcrslauncher.exe --help
          else
            ./target/release/mcrslauncher --help
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mcrslauncher-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/mcrslauncher
            target/release/mcrslauncher.exe
